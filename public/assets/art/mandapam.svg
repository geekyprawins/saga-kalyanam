<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" role="img" aria-label="A wedding mandapam lit from within">
  <defs>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e1c28"/>
      <stop offset="0.55" stop-color="#6a1420"/>
      <stop offset="1" stop-color="#430c13"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a0e15"/>
      <stop offset="0.28" stop-color="#8a1d29"/>
      <stop offset="0.55" stop-color="#a8283a"/>
      <stop offset="0.8" stop-color="#6a1420"/>
      <stop offset="1" stop-color="#3a0a11"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7bd"/>
      <stop offset="0.5" stop-color="#d9b26a"/>
      <stop offset="1" stop-color="#a87c2e"/>
    </linearGradient>
    <radialGradient id="innerLight" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffcf8f" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#e08542" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7a2a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="310" cy="380" rx="250" ry="200" fill="url(#innerLight)"/>

  <!-- canopy beam -->
  <path d="M46 96h528v18H46z" fill="url(#gold)" opacity="0.9"/>
  <path d="M52 114h516v16H52z" fill="url(#fabric)"/>
  <path d="M52 130h516" stroke="#e0c084" stroke-width="1.4" opacity="0.75"/>

  <!-- scalloped valance -->
  <path d="M52 130h516v34q-26 0-26 22t-26 0q-26-22-52 0t-52 0q-26-22-52 0t-52 0q-26-22-52 0t-52 0q-26-22-52 0t-52 0q-26 22-26-22z" fill="url(#fabric)" stroke="#e0c084" stroke-width="1.5" stroke-opacity="0.8" stroke-linejoin="round"/>

  <!-- back pillars, softer -->
  <g opacity="0.5">
    <path d="M232 164h26v356h-26z" fill="url(#pillar)"/>
    <path d="M362 164h26v356h-26z" fill="url(#pillar)"/>
  </g>

  <!-- swags -->
  <g fill="none" stroke="#e0c084" stroke-width="1.4" opacity="0.55">
    <path d="M104 176q52 54 104 0"/>
    <path d="M258 176q52 54 104 0"/>
    <path d="M412 176q52 54 104 0"/>
  </g>
  <g fill="none" stroke="#fdf6e6" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.5">
    <path d="M104 176q52 54 104 0"/>
    <path d="M258 176q52 54 104 0"/>
    <path d="M412 176q52 54 104 0"/>
  </g>

  <!-- front pillars -->
  <g>
    <path d="M86 164h34v356H86z" fill="url(#pillar)"/>
    <path d="M500 164h34v356h-34z" fill="url(#pillar)"/>
    <path d="M74 158h58v14H74zM488 158h58v14h-58z" fill="url(#gold)" opacity="0.9"/>
    <path d="M74 516h58v12H74zM488 516h58v12h-58z" fill="url(#gold)" opacity="0.9"/>
    <path d="M68 528h70v14H68zM482 528h70v14h-70z" fill="url(#fabric)" stroke="#e0c084" stroke-width="1.2" stroke-opacity="0.7"/>
  </g>

  <!-- hanging jasmine from the valance -->
  <g fill="none" stroke="#f7e9c4" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 6" opacity="0.4">
    <path d="M150 164v96"/>
    <path d="M282 164v72"/>
    <path d="M340 164v84"/>
    <path d="M470 164v104"/>
  </g>

  <!-- kalash -->
  <g transform="translate(310 96)">
    <path d="M0 -30v-10" stroke="#d9b26a" stroke-width="2" fill="none"/>
    <path d="M-4 -46q-14 -6 -18 -22q14 6 18 22zM4 -46q14 -6 18 -22q-14 6 -18 22zM0 -46q-3 -16 0 -26q3 10 0 26z" fill="#7d1520" stroke="#c49a4e" stroke-width="1"/>
    <ellipse cx="0" cy="-12" rx="7" ry="4" fill="#b98a35"/>
    <path d="M-9 -12q9 8 18 0q-1 10 -9 11q-8 -1 -9 -11z" fill="url(#gold)"/>
    <path d="M-13 -22q13 -4 26 0q-2 10 -13 11q-11 -1 -13 -11z" fill="url(#gold)"/>
  </g>

  <!-- platform -->
  <path d="M40 542h540v18H40z" fill="#3a0a11" opacity="0.85"/>
  <path d="M40 542h540" stroke="#e0c084" stroke-width="1.6" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1948" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Temple courtyard floor with a white kolam and brass lamps">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9986a"/>
      <stop offset="0.22" stop-color="#d3a274"/>
      <stop offset="0.6" stop-color="#c08e60"/>
      <stop offset="1" stop-color="#8e5f3a"/>
    </linearGradient>
    <linearGradient id="floorSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffdca8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3a1f0c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#fff8e0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3a274" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#d3a274" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d3a274" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </radialGradient>
    <symbol id="petalRing" overflow="visible">
      <path d="M0 0 q26 -44 0 -86 q-26 42 0 86 z" fill="none" stroke="#fffaf0" stroke-width="5" stroke-opacity="0.92"/>
    </symbol>
    <symbol id="diya" overflow="visible">
      <circle cx="0" cy="-10" r="26" fill="url(#flameGlow)"/>
      <path d="M0 -30 q7 12 0 20 q-7 -8 0 -20 z" fill="url(#flame)"/>
      <path d="M-9 2 q9 6 18 0 q-3 8 -9 8 q-6 0 -9 -8 z" fill="#8a5a22"/>
    </symbol>
  </defs>

  <g transform="translate(0 130)">
  <rect x="0" y="880" width="900" height="1068" fill="url(#floor)"/>
  <rect x="0" y="860" width="900" height="120" fill="url(#horizon)"/>
  <rect x="0" y="880" width="900" height="1068" fill="url(#floorSheen)"/>

  <!-- paving joints in perspective -->
  <g stroke="#8a5c37" stroke-opacity="0.22" stroke-width="2">
    <line x1="0" y1="960" x2="900" y2="960"/>
    <line x1="0" y1="1030" x2="900" y2="1030"/>
    <line x1="0" y1="1120" x2="900" y2="1120"/>
    <line x1="0" y1="1240" x2="900" y2="1240"/>
    <line x1="450" y1="880" x2="450" y2="1600"/>
    <line x1="450" y1="880" x2="-120" y2="1600"/>
    <line x1="450" y1="880" x2="1020" y2="1600"/>
  </g>

  <!-- kolam -->
  <g transform="translate(450 1420) scale(0.92)" opacity="0.62">
    <circle r="196" fill="none" stroke="#fffaf0" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g>
      <use href="#petalRing" transform="rotate(0)"/>
      <use href="#petalRing" transform="rotate(45)"/>
      <use href="#petalRing" transform="rotate(90)"/>
      <use href="#petalRing" transform="rotate(135)"/>
      <use href="#petalRing" transform="rotate(180)"/>
      <use href="#petalRing" transform="rotate(225)"/>
      <use href="#petalRing" transform="rotate(270)"/>
      <use href="#petalRing" transform="rotate(315)"/>
    </g>
    <g transform="scale(0.55)">
      <use href="#petalRing" transform="rotate(22.5)"/>
      <use href="#petalRing" transform="rotate(67.5)"/>
      <use href="#petalRing" transform="rotate(112.5)"/>
      <use href="#petalRing" transform="rotate(157.5)"/>
      <use href="#petalRing" transform="rotate(202.5)"/>
      <use href="#petalRing" transform="rotate(247.5)"/>
      <use href="#petalRing" transform="rotate(292.5)"/>
      <use href="#petalRing" transform="rotate(337.5)"/>
    </g>
    <circle r="26" fill="none" stroke="#fffaf0" stroke-width="4" stroke-opacity="0.85"/>
    <circle r="9" fill="#fffaf0" fill-opacity="0.75"/>
    <g fill="#d9701c" opacity="0.85">
      <circle cx="0" cy="-150" r="6"/><circle cx="150" cy="0" r="6"/>
      <circle cx="0" cy="150" r="6"/><circle cx="-150" cy="0" r="6"/>
    </g>
  </g>

  <!-- row of small lamps along the courtyard -->
  <g opacity="0.95">
    <use href="#diya" x="120" y="948"/>
    <use href="#diya" x="240" y="944"/>
    <use href="#diya" x="360" y="941"/>
    <use href="#diya" x="540" y="941"/>
    <use href="#diya" x="660" y="944"/>
    <use href="#diya" x="780" y="948"/>
  </g>

  <!-- scattered petals on the floor -->
  <g opacity="0.75">
    <ellipse cx="300" cy="1120" rx="14" ry="7" fill="#c22b3a" transform="rotate(-24 300 1120)"/>
    <ellipse cx="620" cy="1080" rx="12" ry="6" fill="#e0a63a" transform="rotate(18 620 1080)"/>
    <ellipse cx="520" cy="1430" rx="16" ry="8" fill="#c22b3a" transform="rotate(32 520 1430)"/>
    <ellipse cx="330" cy="1400" rx="12" ry="6" fill="#f3e6cc" transform="rotate(-12 330 1400)"/>
    <ellipse cx="700" cy="1330" rx="11" ry="6" fill="#e0a63a" transform="rotate(44 700 1330)"/>
  </g>
  </g>
</svg>

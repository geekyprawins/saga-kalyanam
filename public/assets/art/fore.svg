<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1948" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Brass lamp stands and a bowl of jasmine in the foreground">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4310"/>
      <stop offset="0.16" stop-color="#b98a35"/>
      <stop offset="0.34" stop-color="#f2dda4"/>
      <stop offset="0.5" stop-color="#ffeec4"/>
      <stop offset="0.66" stop-color="#d3a44e"/>
      <stop offset="0.84" stop-color="#8e6220"/>
      <stop offset="1" stop-color="#5b3a0e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9e2c"/>
      <stop offset="0.5" stop-color="#ffd077"/>
      <stop offset="1" stop-color="#fffbe8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb04f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d1520"/>
      <stop offset="0.45" stop-color="#a3202c"/>
      <stop offset="1" stop-color="#4a0d12"/>
    </linearGradient>
    <!-- lamp: origin sits on the floor, body rises upward -->
    <symbol id="lamp" overflow="visible">
      <ellipse cx="0" cy="4" rx="86" ry="15" fill="#3a2208" opacity="0.42"/>
      <path d="M-68 -2h136l-9 -24h-118z" fill="url(#brass)"/>
      <path d="M-52 -26h104l-10 -28h-84z" fill="url(#brass)"/>
      <path d="M-26 -54q26 -18 52 0l-4 -30h-44z" fill="url(#brass)"/>
      <rect x="-9" y="-330" width="18" height="248" fill="url(#brass)"/>
      <ellipse cx="0" cy="-190" rx="26" ry="10" fill="url(#brass)"/>
      <ellipse cx="0" cy="-296" rx="21" ry="8" fill="url(#brass)"/>
      <rect x="-7" y="-404" width="14" height="76" fill="url(#brass)"/>
      <path d="M-38 -404q38 -20 76 0q6 40 -38 50q-44 -10 -38 -50z" fill="url(#brass)"/>
      <path d="M-46 -420q46 -14 92 0q-8 18 -46 20q-38 -2 -46 -20z" fill="url(#brass)"/>
      <ellipse cx="0" cy="-422" rx="46" ry="9" fill="#ffeec4" opacity="0.5"/>
      <g>
        <circle cx="0" cy="-472" r="62" fill="url(#glow)"/>
        <path d="M0 -512q20 30 0 52q-20 -22 0 -52z" fill="url(#flame)"/>
        <path d="M0 -498q10 18 0 32q-10 -14 0 -32z" fill="#fffdf2"/>
      </g>
      <path d="M-16 -404q-20 -32 0 -56" stroke="#ffeec4" stroke-opacity="0.38" stroke-width="4" fill="none"/>
    </symbol>
    <symbol id="flowerBowl" overflow="visible">
      <ellipse cx="0" cy="18" rx="122" ry="17" fill="#3a2208" opacity="0.35"/>
      <path d="M-104 -40q104 62 208 0q-10 48 -104 52q-94 -4 -104 -52z" fill="url(#brass)"/>
      <ellipse cx="0" cy="-40" rx="104" ry="17" fill="#f7ead0" opacity="0.3"/>
      <circle cx="-56" cy="-54" r="21" fill="#fffaf0"/>
      <circle cx="-20" cy="-62" r="23" fill="#fdf6e6"/>
      <circle cx="22" cy="-56" r="22" fill="#fffaf0"/>
      <circle cx="58" cy="-50" r="19" fill="#fdf6e6"/>
      <circle cx="-38" cy="-76" r="16" fill="#fffdf6"/>
      <circle cx="8" cy="-80" r="17" fill="#fffdf6"/>
      <circle cx="46" cy="-72" r="15" fill="#fffdf6"/>
      <g fill="#a3202c">
        <circle cx="-72" cy="-70" r="11"/>
        <circle cx="76" cy="-66" r="10"/>
        <circle cx="26" cy="-88" r="9"/>
      </g>
    </symbol>
  </defs>

  <!-- silk drape along the bottom edge -->
  <path d="M0 1846q220 -78 450 -30q230 48 450 -18v150h-900z" fill="url(#drape)" opacity="0.94"/>
  <path d="M0 1846q220 -78 450 -30q230 48 450 -18" fill="none" stroke="#d9ae62" stroke-width="6" stroke-opacity="0.7"/>
  <g fill="#d9ae62" opacity="0.45">
    <circle cx="150" cy="1852" r="5"/><circle cx="300" cy="1838" r="5"/>
    <circle cx="450" cy="1826" r="5"/><circle cx="600" cy="1834" r="5"/>
    <circle cx="750" cy="1846" r="5"/>
  </g>

  <use href="#lamp" x="182" y="1795"/>
  <use href="#lamp" x="718" y="1795"/>
  <use href="#flowerBowl" x="628" y="1812"/>

  <g opacity="0.9">
    <ellipse cx="230" cy="1880" rx="22" ry="11" fill="#c22b3a" transform="rotate(-30 230 1880)"/>
    <ellipse cx="286" cy="1912" rx="18" ry="9" fill="#e0a63a" transform="rotate(20 286 1912)"/>
    <ellipse cx="760" cy="1900" rx="20" ry="10" fill="#c22b3a" transform="rotate(12 760 1900)"/>
  </g>
</svg>

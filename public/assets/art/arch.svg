    <g fill="url(#marigold)" opacity="0.9">
      <circle cx="88" cy="9" r="9"/><circle cx="196" cy="9" r="9"/><circle cx="304" cy="9" r="9"/>
      <circle cx="412" cy="9" r="9"/><circle cx="520" cy="9" r="9"/><circle cx="628" cy="9" r="9"/>
      <circle cx="736" cy="9" r="9"/><circle cx="844" cy="9" r="9"/>

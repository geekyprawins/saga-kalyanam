      <stop offset="0.18" stop-color="#a97b30"/>
      <stop offset="0.36" stop-color="#e8cf94"/>
      <stop offset="0.48" stop-color="#f7ead0"/>
      <stop offset="0.62" stop-color="#d9ae62"/>
      <stop offset="0.82" stop-color="#9a6c26"/>
      <stop offset="1" stop-color="#4d2f0d"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
